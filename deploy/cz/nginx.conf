# /etc/nginx/sites-available/cz.tentrem.space — certbot --nginx menambahkan blok 443 + sertifikat
server {
  listen 80;
  listen [::]:80;
  server_name cz.tentrem.space;
  client_max_body_size 50m;
  # link undangan berisi token di query string: jangan masuk access log
  location = /undangan { access_log off; proxy_pass http://127.0.0.1:4317; include /etc/nginx/kantor-cz-proxy.conf; }
  location / { proxy_pass http://127.0.0.1:4317; include /etc/nginx/kantor-cz-proxy.conf; }
}
