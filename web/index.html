<body>
<div class="app">
  <header class="top"><div class="top-in">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>Kantor Claude</a>
    <nav class="crumbs" id="crumbs" aria-label="Lokasi"></nav>
    <div class="top-right">
      <span class="conn" id="conn" title="Koneksi ke daemon">menyambung…</span>
      <button class="icon-link show-btn" id="showBtn" type="button" title="Dibuka untukmu oleh agen" aria-label="Dibuka untukmu oleh agen">👁<b class="show-n" id="showCount" hidden>0</b></button>
      <button class="icon-link dock-btn" id="dockBtn" type="button" title="Proses &amp; terminal (Ctrl+`)" aria-label="Proses dan terminal">⌨</button>
      <button class="icon-link music-btn" id="musicBtn" type="button" title="Musik kantor" aria-label="Musik kantor" aria-haspopup="dialog">♪</button>
      <button class="pill agents-btn" id="agentsBtn" type="button" title="Agen aktif (Alt+K)" aria-haspopup="dialog" aria-expanded="false"><span class="ag-lbl">Agen</span><b id="agentsCount">0</b><b class="ag-wait" id="agentsWait" hidden>0</b></button>
      <a class="pill" id="inboxPill" href="#/" title="Kotak masuk izin gabungan">Izin <b id="inboxCount">0</b></a>
      <button class="icon-link theme-btn" id="themeBtn" type="button" title="Tema: ikut sistem" aria-label="Ganti tema"></button>
      <a class="icon-link" href="#/pengaturan" title="Pengaturan" aria-label="Pengaturan">⚙</a>
      <a class="pill" id="mePill" href="#/akun" hidden></a>
    </div>
  </div></header>
  <main id="view"></main>
</div>
